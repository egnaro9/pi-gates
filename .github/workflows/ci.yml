name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --omit=dev
      # Node 22 strips the types; no build step, which is also how Pi loads it.
      - run: node --test tests/*.test.mjs
      - run: npx tsc --noEmit
